name: Preserve old Pages links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Generate only the legacy redirect pages
        run: node scripts/deploy/pages-redirect.mjs --output-dir _pages-redirect
      - name: Upload only redirect HTML
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy legacy link redirects
        id: deployment
        uses: actions/deploy-pages@v4
