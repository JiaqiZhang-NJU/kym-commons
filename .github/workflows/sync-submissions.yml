name: Publish Submission Intake

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  intake:
    if: github.event.label.name == 'submission:ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KYM_APP_ID }}
          private-key: ${{ secrets.KYM_APP_PRIVATE_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect submission body and author attachments
        run: node scripts/submissions/fetch-issue-context.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KYM_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          KYM_ISSUE_BODY: ${{ github.event.issue.body }}
          KYM_ISSUE_NUMBER: ${{ github.event.issue.number }}
          KYM_SUBMISSION_CONTEXT_PATH: .kym-submission-context.md
      - name: Generate and validate intake content
        run: node scripts/submissions/issue-to-catalog.mjs && npm run catalog:generate && npm run catalog:check
        env:
          KYM_ISSUE_NUMBER: ${{ github.event.issue.number }}
          KYM_SUBMISSION_CONTEXT_PATH: .kym-submission-context.md
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: intake/submission-${{ github.event.issue.number }}
          delete-branch: true
          title: "content: intake submission #${{ github.event.issue.number }}"
          commit-message: "content: intake submission #${{ github.event.issue.number }}"
          body: "Generated from submission #${{ github.event.issue.number }}. Merge this PR to publish after review."
          labels: submission:intake
